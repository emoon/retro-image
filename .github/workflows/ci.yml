name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The core crate is no_std + alloc; build it for a target without std.
      - run: cargo build -p retro-image --target thumbv7em-none-eabihf
      # Keep the fuzz targets compiling (cargo-fuzz itself needs nightly).
      - run: cargo check --manifest-path fuzz/Cargo.toml
        env:
          RUSTFLAGS: --cfg fuzzing

  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the x86_64 SIMD paths, macOS (arm64) the scalar fallback.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RECOIL's public sample set. The pictures are copyrighted, so they are
      # fetched here and never committed (see CLEANROOM.md). recoil2png isn't
      # installed, so the oracle test skips itself; robustness runs on them.
      # Windows only runs the corpus-free tests.
      - name: Restore corpus
        if: runner.os != 'Windows'
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: recoil-examples-v1
      - name: Fetch corpus
        if: runner.os != 'Windows' && steps.corpus.outputs.cache-hit != 'true'
        run: |
          mkdir -p corpus && cd corpus
          curl -fsSL --retry 3 -o examples.zip https://recoil.sourceforge.net/examples.zip
          unzip -q examples.zip && rm examples.zip
      - run: cargo test --workspace
