[package]
name = "retro-image"
description = "Decoder for image formats of retro computers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
# Code only: the corpus tests need copyrighted samples that are never shipped.
include = ["/src/**", "/LICENSE", "/README.md"]
keywords = ["retro", "image", "decoder", "atari", "amiga"]
categories = ["multimedia::images", "no-std", "parser-implementations"]

[dev-dependencies]
png.workspace = true

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
