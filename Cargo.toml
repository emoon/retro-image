[workspace]
resolver = "3"
members = ["crates/retro-image", "crates/retro-image-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
retro-image = { path = "crates/retro-image" }
png = "0.18"

# The corpus tests decode thousands of files many times over; optimise them
# but keep overflow checks and debug assertions so arithmetic bugs still panic.
[profile.test]
opt-level = 3
